<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>L.I.P.A.S. Earth · Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/earth.css?v=2">
  <link rel="stylesheet" href="styles/globe-page.css?v=4">
  <style>
    body { --steel: #3ecf8e; --steel-dim: #2da86a; --steel-glow: rgba(62,207,142,.22); --globe-accent-rgb: 62, 207, 142; overflow: hidden; }
    .sat-panel { position: fixed; left: auto; right: 16px; top: 88px; bottom: auto; z-index: 1000; width: min(260px, calc(100vw - 40px)); max-height: 42vh; overflow: auto;
      background: linear-gradient(165deg, rgba(16,32,24,.95), rgba(12,16,14,.98)); border: 1px solid rgba(62,207,142,.22);
      border-radius: 20px; border-left: 3px solid rgba(62,207,142,.45); padding: 12px; }
    .sat-panel .control-title { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #3ecf8e; font-weight: 700; margin-bottom: 8px; }
    .sat-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(140,200,170,.1); font-size: 13px; }
    .sat-item button { background: transparent; border: 1px solid rgba(62,207,142,.35); color: #d7f8e8; font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer; }
    .sat-item.active .n { color: #9ef0c5; }
    .sat-follow { margin-top: 8px; font-size: 12px; color: #8fb8a8; }
    #overviewBtn { margin-top: 8px; width: 100%; background: transparent; border: 1px solid rgba(62,207,142,.4); color: #d7f8e8; font: inherit; font-size: 12px; padding: 6px 8px; cursor: pointer; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.130/Build/Cesium/Widgets/widgets.css">
</head>
<body data-app="earth" class="earth-mode">
  <div class="loading-screen" id="loadingScreen">
    <div class="load-label">Loading Earth Globe</div>
  </div>
  <div id="lipas-topnav" data-active="globe"></div>

  <div class="globe-tools" id="globeTools">
    <div class="loc-search-panel" id="locSearchPanel">
      <div class="control-title">Find location</div>
      <input type="search" id="locSearchInput" placeholder="Search Earth sites…" autocomplete="off">
      <div id="locSearchResults"></div>
    </div>
    <button type="button" class="globe-options-toggle" id="globeOptionsOpen">Open options</button>
    <div class="map-controls" id="mapControls">
      <div class="control-panel">
        <div class="control-title">View</div>
        <div class="control-item"><input type="checkbox" id="enableLighting" checked><label for="enableLighting">Lighting</label></div>
        <div class="control-item"><input type="checkbox" id="showAtmosphere" checked><label for="showAtmosphere">Atmosphere</label></div>
        <div class="control-item"><input type="checkbox" id="showLocations" checked><label for="showLocations">Site markers</label></div>
        <div class="control-item"><input type="checkbox" id="showOrbits" checked><label for="showOrbits">Satellite orbits</label></div>
        <div class="control-item"><input type="checkbox" id="showHazards" checked><label for="showHazards">Hazard blobs</label></div>
        <div class="control-item"><input type="checkbox" id="haz-aurora" checked><label for="haz-aurora">Aurora oval</label></div>
        <div class="control-item"><input type="checkbox" id="haz-hf" checked><label for="haz-hf">HF blackout</label></div>
        <div class="control-item"><input type="checkbox" id="haz-pca" checked><label for="haz-pca">Polar cap</label></div>
        <div class="control-item"><input type="checkbox" id="haz-gnss" checked><label for="haz-gnss">GNSS scint.</label></div>
        <div class="control-item"><input type="checkbox" id="autoRotate"><label for="autoRotate">Auto-rotate</label></div>
        <button type="button" id="overviewBtn">Earth overview</button>
      </div>
      <div class="control-panel">
        <div class="control-title">View mode</div>
        <div class="control-item">
          <select id="viewMode">
            <option value="3d">3D Globe</option>
            <option value="2d">2D Map</option>
            <option value="columbus">Columbus View</option>
          </select>
        </div>
      </div>
      <button type="button" class="globe-options-close" id="globeOptionsClose">Close option selection &amp; view globe</button>
    </div>
  </div>

  <div class="sat-panel" id="satPanel">
    <div class="control-title">Catalog · all tracked</div>
    <input class="sat-filter" id="satFilter" type="search" placeholder="Filter ISS, GPS, NOAA…" autocomplete="off">
    <div id="satList"></div>
    <label class="sat-follow"><input type="checkbox" id="followSat"> Camera follow</label>
  </div>

  <div id="locHoverCard">
    <h4 id="locHoverName">-</h4>
    <div class="coords" id="locHoverCoords">-</div>
    <div class="hov-status go" id="locHoverStatus"><span class="dot"></span><span id="locHoverStatusText">GO</span></div>
    <div class="summary" id="locHoverSummary">-</div>
    <div class="hov-hazards" id="locHoverHazards"></div>
    <div class="loc-actions">
      <a class="loc-dash-btn" id="locDashBtn" href="earth.html">View in dashboard</a>
      <button type="button" class="loc-close-btn" id="locCloseBtn">Close</button>
    </div>
  </div>

  <div id="cesiumContainer"></div>

  <div class="legend-panel" id="legendPanel">
    <div class="legend-title">Earth</div>
    <div class="legend-item"><div class="legend-color" style="background:#3ecf8e"></div><span>Launch sites</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#7dffb2"></div><span>LEO</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#e0b14a"></div><span>MEO</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#b794f6"></div><span>GEO</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#3dff9a"></div><span>Aurora</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#ffb020"></div><span>HF</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#ff5a6a"></div><span>Polar cap</span></div>
    <div class="legend-item"><div class="legend-color" style="background:#e07ad0"></div><span>GNSS</span></div>
  </div>

  <div class="globe-timebar" id="globeTimebar">
    <div class="timebar-head">
      <span class="timebar-kicker">Next 24 hours</span>
      <strong id="globeHourLabel">Now</strong>
    </div>
    <input type="range" id="globeHourSlider" min="0" max="24" step="1" value="0">
    <div class="timebar-ticks">
      <span>Now</span><span>+6h</span><span>+12h</span><span>+18h</span><span>+24h</span>
    </div>
    <div class="timebar-meta" id="globeHourMeta"></div>
  </div>

  <script src="js/lipas-api.js"></script>
  <script src="js/globe_timebar.js?v=1"></script>
  <script src="https://unpkg.com/cesium@1.130/Build/Cesium/Cesium.js"></script>
  <script src="js/earth_globe.js?v=8"></script>
  <script src="js/navbar.js?v=26" defer></script>
</body>
</html>
